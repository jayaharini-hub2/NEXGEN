
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shop — NEXGEN</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/shop.css">
</head>

<body>

    <header class="shop-header">
        <a href="../index.html" class="shop-logo">NEXGEN<span>.</span></a>

        <nav>
            <a href="../index.html">Home</a>
            <a href="shop.html" class="active">Shop</a>
            <a href="cart.html">Cart</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main class="shop-container">

        <section class="shop-heading">
            <p class="shop-eyebrow">THE NEXGEN COLLECTION</p>
            <h1>Explore our collection.</h1>
            <p>Discover products selected for your everyday lifestyle.</p>
        </section>

        <p id="shop-message">Loading products...</p>

        <div id="category-sections"></div>

    </main>

    <footer class="shop-footer">
        <p>© 2026 NEXGEN. All rights reserved.</p>
    </footer>

    <script type="module">

        import {
            db,
            collection,
            getDocs,
            query,
            where
        } from "../assets/js/firebase-config.js";

        const categoryContainer =
            document.getElementById("category-sections");

        const message =
            document.getElementById("shop-message");

        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[char]);
        }

        function getPrice(product) {
            return Number(product.price || 0);
        }

        function formatPrice(price) {
            return new Intl.NumberFormat("en-IN", {
                style: "currency",
                currency: "INR",
                maximumFractionDigits: 0
            }).format(price);
        }

        function renderProduct(product, productId) {

            const image = product.imageUrl ||
                "https://placehold.co/600x400?text=NEXGEN";

            return `
                <article class="shop-product-card">

                    <a href="product.html?id=${encodeURIComponent(productId)}"
                       class="shop-product-image">

                        <img
                            src="${escapeHTML(image)}"
                            alt="${escapeHTML(product.name)}"
                            loading="lazy"
                            onerror="this.src='https://placehold.co/600x400?text=NEXGEN'"
                        >

                    </a>

                    <div class="shop-product-info">

                        <p class="shop-product-brand">
                            ${escapeHTML(product.brand || "NEXGEN")}
                        </p>

                        <h3>${escapeHTML(product.name)}</h3>

                        <div class="shop-product-rating">
                            ★ ${Number(product.rating || 0).toFixed(1)}
                            <span>(${Number(product.reviewCount || 0)} reviews)</span>
                        </div>

                        <div class="shop-product-price">
                            ${formatPrice(getPrice(product))}
                        </div>

                        <a
                            class="shop-view-button"
                            href="product.html?id=${encodeURIComponent(productId)}"
                        >
                            View Product
                        </a>

                    </div>

                </article>
            `;
        }

        async function loadShop() {

            try {

                const categoryQuery = query(
                    collection(db, "categories"),
                    where("isActive", "==", true)
                );

                const productQuery = query(
                    collection(db, "products"),
                    where("isActive", "==", true)
                );

                const [categorySnapshot, productSnapshot] =
                    await Promise.all([
                        getDocs(categoryQuery),
                        getDocs(productQuery)
                    ]);

                const categories = categorySnapshot.docs
                    .map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }))
                    .sort((a, b) =>
                        (a.displayOrder || 0) - (b.displayOrder || 0)
                    );

                const products = productSnapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));

                if (categories.length === 0) {
                    message.textContent = "No active categories found.";
                    return;
                }

                if (products.length === 0) {
                    message.textContent = "No active products found.";
                    return;
                }

                let html = "";
                let displayedCount = 0;

                categories.forEach(category => {

                    const categoryProducts = products.filter(
                        product => product.categoryId === category.id
                    );

                    if (categoryProducts.length === 0) {
                        return;
                    }

                    displayedCount += categoryProducts.length;

                    html += `
                        <section class="shop-category">

                            <div class="shop-category-heading">

                                <div>
                                    <p class="shop-eyebrow">EXPLORE CATEGORY</p>
                                    <h2>${escapeHTML(category.name)}</h2>
                                    <p>${escapeHTML(category.description || "")}</p>
                                </div>

                                <span class="shop-product-count">
                                    ${categoryProducts.length} Products
                                </span>

                            </div>

                            <div class="shop-product-grid">

                                ${categoryProducts.map(product =>
                                    renderProduct(product, product.id)
                                ).join("")}

                            </div>

                        </section>
                    `;
                });

                categoryContainer.innerHTML = html;

                message.textContent = displayedCount
                    ? `${displayedCount} products available`
                    : "No products are currently available in these categories.";

            } catch (error) {

                console.error("Shop loading error:", error);

                message.textContent =
                    "Unable to load products. Please check your Firebase connection and Firestore rules.";

            }
        }

        loadShop();

    </script>

</body>
</html>
